<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Weatherly ☀️</h1>
            <p>Check the weather anywhere in the world</p>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button type="button" onclick="getWeather()">
                Search
            </button>
        </section>

        <main id="weatherResult" class="weather-result">
            <div class="welcome">
                <h2>Welcome!</h2>
                <p>Search for a city to see its current weather.</p>
            </div>
        </main>

        <footer>
            <p>Weatherly | Powered by Open-Meteo</p>
        </footer>

    </div>

    <script src="app.js"></script>

</body>
</html>
